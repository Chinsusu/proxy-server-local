# Runtime/state roots. Secret files are provisioned separately and are never
# created with empty placeholder contents by tmpfiles.
d /etc/pgw                     0750 root      pgw-config  -
d /var/lib/pgw                 0750 pgw-api   pgw-control -
d /var/lib/pgw-agent           0750 pgw-agent pgw-agent   -
d /var/lib/pgw-lifecycle       0700 root      root        -
d /run/pgw                     0755 root      root        -
d /run/pgw/control             0750 pgw-api   pgw-control -
d /run/pgw/forwarders          0750 pgw-agent pgw-fwd     -
d /run/pgw/agent-rollback      0700 pgw-agent pgw-agent   -
z /var/lib/pgw/pgw.db          0640 pgw-api   pgw-api     -
z /var/lib/pgw/pgw.db-wal      0640 pgw-api   pgw-api     -
z /var/lib/pgw/pgw.db-shm      0640 pgw-api   pgw-api     -
z /etc/pgw/pgw.env             0640 root      pgw-config  -
z /etc/pgw/jwt_secret          0600 root      root        -
z /etc/pgw/admin_pass_hash     0600 root      root        -
z /etc/pgw/secrets.key         0600 root      root        -
z /etc/pgw/agent.token         0600 root      root        -
d /etc/pgw/credential-inbox    0700 root      root        -
d /etc/pgw/credential-generations 0700 root   root        -
z /etc/pgw/snapshot.hmac       0600 root      root        -
z /etc/pgw/snapshot-encryption.key 0600 root  root        -
z /etc/pgw/ui.crt              0600 root      root        -
z /etc/pgw/ui.key              0600 root      root        -
