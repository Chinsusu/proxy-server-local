[Unit]
Before=systemd-sysctl.service pgw-api.service pgw-agent.service

[Service]
EnvironmentFile=/etc/pgw/pgw.env
# The distro nftables loader remains the sole boot-time ruleset writer. This
# syntax gate prevents mutation by an invalid base file; the postcondition
# makes a missing, extra, or incomplete pgw_base fail the unit.
ExecStartPre=/usr/sbin/nft -c -f /etc/nftables.conf
ExecStartPost=/usr/local/sbin/pgw-verify-base
