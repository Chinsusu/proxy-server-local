name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.7"
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Format, vet, and non-root deployment contracts
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting of changed Go files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            diff_range=("$PR_BASE_SHA...$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == push && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            diff_range=("$PUSH_BASE_SHA" "$PUSH_HEAD_SHA")
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            diff_range=("$base" HEAD)
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "${diff_range[@]}" -- '*.go')
          ((${#files[@]} == 0)) && exit 0
          unformatted="$(gofmt -l "${files[@]}")"
          [[ -z "$unformatted" ]] || { printf 'Run gofmt on:\n%s\n' "$unformatted" >&2; exit 1; }

      - name: Run Go vet
        run: go vet ./...

      - name: Shell syntax, lint, CRLF, and non-root hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(id -u)" != 0 ]]
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0 | sort -z)
          ((${#scripts[@]} > 0))
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck --severity=error "${scripts[@]}"
          if git grep -Il $'\r' -- '*.go' '*.sh' '*.py' '*.js' '*.json' '*.md' '*.service' '*.conf' '*.rules' '*.yml' '*.yaml'; then
            echo 'CRLF is forbidden in source and deployment inputs.' >&2
            exit 1
          fi
          python3 -B deploy/tests/release_snapshot_boundary_test.py
          python3 -B deploy/tests/full_system_evidence_parser_test.py
          python3 -B deploy/tests/ci_privilege_domain_test.py
          bash deploy/tests/attestation_bootstrap_test.sh
          bash deploy/tests/full_system_trust_bootstrap_test.sh
          bash deploy/tests/hardening_test.sh

  test:
    name: Unit tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests without privilege
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(id -u)" != 0 ]]
          go test -count=1 ./...

  security:
    name: Dependency integrity, secret ratchet, and vulnerability audit
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify downloaded modules
        run: go mod verify
      - name: Select new-commit secret scan range
        id: secret-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BASE_SHA..$PUSH_HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            range=HEAD
          fi
          echo "log_opts=$range" >>"$GITHUB_OUTPUT"
      - name: Block newly introduced secrets
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.secret-range.outputs.log_opts }}
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/zricethezav/gitleaks/v8@v8.28.0 git \
            --log-opts="$GITLEAKS_LOG_OPTS" --redact --no-banner \
            --report-format=json --report-path=gitleaks-report.json .
      - name: Upload redacted secret ratchet evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-${{ github.run_id }}-${{ github.run_attempt }}
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Audit reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  protected-systemd:
    name: Protected push / systemd 249 and privileged isolation
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Chinsusu/proxy-server-local' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out protected push SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject non-semver tag and checkout mismatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]{0,31})?$ ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
      - name: Verify committed units on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nftables systemd
          version="$(systemd-analyze --version | awk 'NR==1 {print $2}')"
          [[ "$version" == 249* ]]
          sudo install -m 0755 deploy/pgw-verify-base.sh /usr/local/sbin/pgw-verify-base
          sudo install -m 0755 deploy/pgw-verify-ui-bind.sh /usr/local/sbin/pgw-verify-ui-bind
          sudo systemd-analyze verify deploy/systemd/*.service
      - name: Required privileged isolation evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo env PGW_REQUIRE_NONROOT_CRASH_EVIDENCE=1 /bin/bash deploy/tests/nonroot_crash_evidence_runner.sh
          sudo /bin/bash deploy/tests/restore_snapshot_test.sh
          sudo env PGW_REQUIRE_SNAPSHOT_PAYLOAD_ROOT_EVIDENCE=1 /bin/bash deploy/tests/snapshot_payload_linux_root_test.sh
          sudo env PGW_REQUIRE_BASE_INSTALLER_EVIDENCE=1 /bin/bash deploy/tests/base_installer_failclose_test.sh
  candidate-release:
    name: Protected push / closed diagnostic candidate only
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Chinsusu/proxy-server-local' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality, test, security, protected-systemd]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out protected push SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Validate protected identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          release_id="git-${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]{0,31})?$ ]]
            release_id="$GITHUB_REF_NAME"
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
      - name: Install fixed release tools on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils file jq
          tool_bin="${RUNNER_TEMP}/pgw-release-tools"
          install -d -m 0755 "$tool_bin"
          GOBIN="$tool_bin" GOENV=off GOTOOLCHAIN=local go install github.com/anchore/syft/cmd/syft@v1.34.2
          GOBIN="$tool_bin" GOENV=off GOTOOLCHAIN=local go install github.com/zricethezav/gitleaks/v8@v8.28.0
          (cd "$tool_bin" && sha256sum syft gitleaks) >"${RUNNER_TEMP}/release-tool-binaries.sha256"
          cat >"${RUNNER_TEMP}/release-tool-versions.manifest" <<'EOF'
          format pgw-release-tool-versions-v1
          tool syft v1.34.2
          tool gitleaks v8.28.0
          EOF
      - name: Build exact-SHA deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/build-release.sh --source-commit "$GITHUB_SHA" \
            "${{ steps.identity.outputs.release_id }}" "${RUNNER_TEMP}/pgw-assembly"
      - name: Non-root fixture rehearsal
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash deploy/rehearse-release.sh \
            "${RUNNER_TEMP}/pgw-assembly" "${RUNNER_TEMP}/pgw-rehearsal-evidence"
          install -m 0644 "${RUNNER_TEMP}/release-tool-binaries.sha256" \
            "${RUNNER_TEMP}/pgw-rehearsal-evidence/release-tool-binaries.sha256"
          install -m 0644 "${RUNNER_TEMP}/release-tool-versions.manifest" \
            "${RUNNER_TEMP}/pgw-rehearsal-evidence/release-tool-versions.manifest"
      - name: Finalize nonpromotable diagnostic candidate and close deterministic tar
        env:
          PATH: ${{ runner.temp }}/pgw-release-tools:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          bash deploy/finalize-release.sh \
            "${RUNNER_TEMP}/pgw-assembly" "${RUNNER_TEMP}/pgw-rehearsal-evidence" "${RUNNER_TEMP}/pgw-candidate"
          bash deploy/close-release.sh "${RUNNER_TEMP}/pgw-candidate" \
            "$(pwd)/dist/pgw-release-candidate.tar"
      - name: Upload closed diagnostic candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgw-candidate-diagnostic-${{ github.sha }}
          path: dist/pgw-release-candidate.tar
          if-no-files-found: error
          retention-days: 14
