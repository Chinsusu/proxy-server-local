name: Network Namespace E2E

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      require_harness:
        description: Fail unless the product namespace harness is present
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: network-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.7"
  GOTOOLCHAIN: local

jobs:
  namespace-evidence:
    name: Privileged namespace evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 0077
          install -d -m 0700 "$RUNNER_TEMP/pgw-netns-evidence"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            echo "bootstrap=PASS"
          } > "$RUNNER_TEMP/pgw-netns-evidence/bootstrap.txt"

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install namespace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            curl \
            iproute2 \
            iptables \
            iputils-ping \
            nftables \
            python3 \
            tcpdump
          sudo -n true

      - name: Build test binaries
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$RUNNER_TEMP/pgw-e2e-bin"
          commands=(api agent fwd health ui)
          for command in "${commands[@]}"; do
            go build \
              -trimpath \
              -buildvcs=false \
              -o "$RUNNER_TEMP/pgw-e2e-bin/pgw-${command}" \
              "./cmd/${command}"
          done

      - name: Verify the IPv6 management liveness oracle
        shell: bash
        run: |
          set -euo pipefail
          sudo /bin/bash test/e2e/ipv6_management_oracle_test.sh

      - name: Run isolated namespace harness
        id: run_harness
        env:
          REQUIRE_HARNESS: ${{ inputs.require_harness || false }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 0077

          evidence="$RUNNER_TEMP/pgw-netns-evidence"
          install -d -m 0700 "$evidence"
          run_token="$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-10)"
          prefix="pgw-e2e-${run_token}"
          ns_client="${prefix}-client"
          ns_gateway="${prefix}-gateway"
          veth_client="pc${run_token}"
          veth_gateway="pg${run_token}"
          resource_manifest="$evidence/resources-${run_token}.tsv"
          product_artifacts="$RUNNER_TEMP/.pgw-e2e-product-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          harness=""
          if [[ -f "test/e2e/netns_legacy_web_only.sh" ]]; then
            harness="test/e2e/netns_legacy_web_only.sh"
          elif [[ -f "test/e2e/netns/run.sh" ]]; then
            harness="test/e2e/netns/run.sh"
          fi

          cleanup() {
            exit_rc=$?
            cleanup_rc=0
            set +e
            sudo ip netns list > "$evidence/namespaces-before-cleanup.txt" 2>&1
            if [[ -f "$resource_manifest" ]]; then
              while IFS=$'\t' read -r resource_type resource_name; do
                [[ -n "$resource_type" && -n "$resource_name" ]] || continue
                [[ "$resource_name" == *"$run_token"* ]] || {
                  echo "refusing cleanup without current run token: $resource_type $resource_name" \
                    >> "$evidence/cleanup.log"
                  cleanup_rc=1
                  continue
                }
                case "$resource_type" in
                  netns)
                    sudo ip netns delete "$resource_name" >> "$evidence/cleanup.log" 2>&1
                    ;;
                  link)
                    sudo ip link delete "$resource_name" >> "$evidence/cleanup.log" 2>&1
                    ;;
                  *)
                    echo "refusing unknown resource type: $resource_type" \
                      >> "$evidence/cleanup.log"
                    cleanup_rc=1
                    ;;
                esac
              done < "$resource_manifest"
            fi
            sudo ip netns list | awk '{print $1}' \
              > "$evidence/namespaces-after-cleanup.txt" 2>&1
            ip -o link show | awk -F': ' '{print $2}' | cut -d@ -f1 \
              > "$evidence/interfaces-after-cleanup.txt" 2>&1
            while IFS=$'\t' read -r resource_type resource_name; do
              [[ -n "$resource_type" && -n "$resource_name" ]] || continue
              case "$resource_type" in
                netns)
                  if grep -Fxq "$resource_name" "$evidence/namespaces-after-cleanup.txt"; then
                    cleanup_rc=1
                  fi
                  ;;
                link)
                  if grep -Fxq "$resource_name" "$evidence/interfaces-after-cleanup.txt"; then
                    cleanup_rc=1
                  fi
                  ;;
              esac
            done < "$resource_manifest"
            if [[ "$cleanup_rc" -ne 0 ]]; then
              echo "cleanup=FAILED" >> "$evidence/summary.txt"
              exit_rc=1
            else
              echo "cleanup=PASS" >> "$evidence/summary.txt"
            fi
            echo "exit_code=$exit_rc" >> "$evidence/summary.txt"
            exit "$exit_rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            echo "run_token=$run_token"
            echo "namespace_prefix=$prefix"
            echo "product_artifact_dir=$product_artifacts"
          } > "$evidence/summary.txt"

          if [[ -e "$product_artifacts" || -L "$product_artifacts" ]]; then
            echo "product_artifact_source_init=FAILED:already_exists" >> "$evidence/summary.txt"
            exit 1
          fi
          install -d -m 0700 "$product_artifacts"
          [[ -d "$product_artifacts" && ! -L "$product_artifacts" ]] || {
            echo "product_artifact_source_init=FAILED:invalid_directory" >> "$evidence/summary.txt"
            exit 1
          }
          echo "product_artifact_source_init=PASS" >> "$evidence/summary.txt"

          printf 'netns\t%s\n' "$ns_client" "$ns_gateway" > "$resource_manifest"
          printf 'link\t%s\n' "$veth_client" "$veth_gateway" >> "$resource_manifest"

          uname -a > "$evidence/uname.txt"
          go version > "$evidence/go-version.txt"
          nft --version > "$evidence/nft-version.txt"
          ip -Version > "$evidence/ip-version.txt" 2>&1
          sha256sum "$RUNNER_TEMP"/pgw-e2e-bin/pgw-* > "$evidence/binary-sha256.txt"

          sudo ip netns add "$ns_client"
          sudo ip netns add "$ns_gateway"
          sudo ip link add "$veth_client" type veth peer name "$veth_gateway"
          sudo ip link set "$veth_client" netns "$ns_client"
          sudo ip link set "$veth_gateway" netns "$ns_gateway"
          sudo ip -n "$ns_client" link set "$veth_client" name eth0
          sudo ip -n "$ns_gateway" link set "$veth_gateway" name eth0
          sudo ip -n "$ns_client" address add 10.254.0.2/30 dev eth0
          sudo ip -n "$ns_gateway" address add 10.254.0.1/30 dev eth0
          sudo ip -n "$ns_client" link set lo up
          sudo ip -n "$ns_gateway" link set lo up
          sudo ip -n "$ns_client" link set eth0 up
          sudo ip -n "$ns_gateway" link set eth0 up
          sudo ip netns exec "$ns_client" ping -c 1 -W 2 10.254.0.1 \
            > "$evidence/namespace-connectivity.txt"

          sudo ip netns exec "$ns_gateway" nft -c -f - <<'NFT'
          table inet pgw_e2e_preflight {
            chain input {
              type filter hook input priority 0; policy accept;
              ip protocol icmp counter accept
            }
          }
          NFT
          sudo ip netns exec "$ns_gateway" nft -f - <<'NFT'
          table inet pgw_e2e_preflight {
            chain input {
              type filter hook input priority 0; policy accept;
              ip protocol icmp counter accept
            }
          }
          NFT
          sudo ip netns exec "$ns_gateway" nft -j list ruleset \
            > "$evidence/preflight-ruleset.json"
          echo "runner_preflight=PASS" >> "$evidence/summary.txt"
          sudo ip netns delete "$ns_client"
          sudo ip netns delete "$ns_gateway"
          echo "runner_preflight_cleanup=PASS" >> "$evidence/summary.txt"

          if [[ -n "$harness" ]]; then
            base_kill_switch=1
            artifact_keys=(
              rendered_ruleset
              base_ruleset
              dynamic_ruleset
              rendered_sha256_file
              applied_ruleset_json
              applied_ruleset_text
              counters
              probe_log
              valid_dynamic_replacement
              dynamic_before_invalid_json
              dynamic_after_invalid_json
              invalid_dynamic_candidate
              invalid_dynamic_stdout_log
              invalid_dynamic_stderr_log
              base_after_invalid_json
              gateway_http_log
              gateway_http_restarted_log
              gateway_dns_tcp_log
              gateway_management_log
              gateway_management_ipv6_log
              wan_direct_sentinel_log
              wan_http_log
              wan_http6_log
              udp_control_before_rules_log
              udp_blocked_client_log
              udp_control_after_rules_log
            )
            optional_artifact_keys=(
              optional_startup_readiness_diagnostics
              optional_readiness_mapped_ipv4_log
              optional_readiness_unmapped_ipv4_log
              optional_readiness_ipv6_log
              optional_readiness_management_ipv6_log
              optional_readiness_direct_sentinel_log
              optional_counters_capture_error
            )
            declare -A expected_artifact_names=(
              [rendered_ruleset]="product-rendered-ruleset.nft"
              [base_ruleset]="product-base-ruleset.nft"
              [dynamic_ruleset]="product-dynamic-ruleset.nft"
              [rendered_sha256_file]="product-rendered-ruleset.sha256"
              [applied_ruleset_json]="product-applied-ruleset.json"
              [applied_ruleset_text]="product-applied-ruleset.txt"
              [counters]="product-counters.json"
              [probe_log]="product-probes.log"
              [valid_dynamic_replacement]="product-valid-dynamic-replacement.nft"
              [dynamic_before_invalid_json]="product-dynamic-before-invalid.json"
              [dynamic_after_invalid_json]="product-dynamic-after-invalid.json"
              [invalid_dynamic_candidate]="product-invalid-dynamic-candidate.nft"
              [invalid_dynamic_stdout_log]="product-invalid-dynamic.stdout.log"
              [invalid_dynamic_stderr_log]="product-invalid-dynamic.stderr.log"
              [base_after_invalid_json]="product-base-after-invalid.json"
              [gateway_http_log]="gateway-http.log"
              [gateway_http_restarted_log]="gateway-http-restarted.log"
              [gateway_dns_tcp_log]="gateway-dns-tcp.log"
              [gateway_management_log]="gateway-management.log"
              [gateway_management_ipv6_log]="gateway-management-ipv6.log"
              [wan_direct_sentinel_log]="wan-direct-sentinel.log"
              [wan_http_log]="wan-http.log"
              [wan_http6_log]="wan-http6.log"
              [udp_control_before_rules_log]="udp-control-before-rules.log"
              [udp_blocked_client_log]="udp-blocked-client.log"
              [udp_control_after_rules_log]="udp-control-after-rules.log"
            )
            declare -A expected_optional_artifact_names=(
              [optional_startup_readiness_diagnostics]="startup-readiness-diagnostics.txt"
              [optional_readiness_mapped_ipv4_log]="readiness-mapped-ipv4.curl.log"
              [optional_readiness_unmapped_ipv4_log]="readiness-unmapped-ipv4.curl.log"
              [optional_readiness_ipv6_log]="readiness-ipv6.curl.log"
              [optional_readiness_management_ipv6_log]="readiness-management-ipv6.curl.log"
              [optional_readiness_direct_sentinel_log]="readiness-direct-sentinel.curl.log"
              [optional_counters_capture_error]="product-counters.capture-error.txt"
            )
            product_allowlist=(product-manifest.txt)
            for key in "${artifact_keys[@]}"; do
              product_allowlist+=("${expected_artifact_names[$key]}")
            done
            for key in "${optional_artifact_keys[@]}"; do
              product_allowlist+=("${expected_optional_artifact_names[$key]}")
            done
            declare -A seen_product_artifacts=()
            for artifact_name in "${product_allowlist[@]}"; do
              [[ "$artifact_name" == "$(basename -- "$artifact_name")" && \
                  ! -v "seen_product_artifacts[$artifact_name]" ]] || {
                echo "product_evidence_contract=FAILED:duplicate_or_invalid_filename" \
                  >> "$evidence/summary.txt"
                exit 1
              }
              seen_product_artifacts["$artifact_name"]=1
            done
            audit_product_package() {
              local package="$1"
              local digest_extra digest_hash digest_name entry file_count=0 key
              local name package_gid package_mode package_uid source_file_count=0
              local status_file status_gid status_mode status_uid status_links value
              local -a required_status_keys=(
                package_contract
                validation
                harness_exit
                semantic_validation
                allowlist_contract
                source_manifest_file
                source_manifest_presence
                packaged_source_files
                digest_file
                digest_scope
                run_id
                run_attempt
                run_token
              )
              local -A allowed_package_files=()
              local -A allowed_status_keys=()
              local -A digest_seen=()
              local -A package_status=()

              [[ -d "$package" && ! -L "$package" ]] || return 1
              IFS=: read -r package_uid package_gid package_mode < <(
                stat -c '%u:%g:%a' -- "$package"
              )
              [[ "$package_uid" == "$(id -u)" && "$package_gid" == "$(id -g)" && \
                  "$package_mode" == "700" ]] || return 1
              [[ -z "$(find -P "$package" -xdev -mindepth 2 -print -quit)" ]] || return 1
              [[ -z "$(find -P "$package" -xdev -mindepth 1 -maxdepth 1 \
                ! -type f -print -quit)" ]] || return 1

              for name in "${product_allowlist[@]}" \
                product-evidence-status.txt product-evidence-sha256.txt; do
                allowed_package_files["$name"]=1
              done
              while IFS= read -r -d '' entry; do
                name="${entry##*/}"
                [[ -v "allowed_package_files[$name]" ]] || return 1
                IFS=: read -r status_uid status_gid status_mode status_links < <(
                  stat -c '%u:%g:%a:%h' -- "$entry"
                )
                [[ "$status_uid" == "$(id -u)" && "$status_gid" == "$(id -g)" && \
                    "$status_mode" == "600" && "$status_links" == "1" ]] || return 1
                ((file_count += 1))
                if [[ "$name" != "product-evidence-status.txt" && \
                    "$name" != "product-evidence-sha256.txt" ]]; then
                  ((source_file_count += 1))
                fi
              done < <(find -P "$package" -xdev -mindepth 1 -maxdepth 1 \
                -type f -print0)

              status_file="$package/product-evidence-status.txt"
              [[ -f "$status_file" && ! -L "$status_file" ]] || return 1
              for key in "${required_status_keys[@]}"; do
                allowed_status_keys["$key"]=1
              done
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^[a-z][a-z0-9_]*$ && -n "$value" && \
                    -v "allowed_status_keys[$key]" && \
                    ! -v "package_status[$key]" ]] || return 1
                package_status["$key"]="$value"
              done < "$status_file"
              for key in "${required_status_keys[@]}"; do
                [[ -n "${package_status[$key]:-}" ]] || return 1
              done
              [[ "${package_status[package_contract]}" == \
                  "pgw-product-evidence-package-v1" ]] || return 1
              [[ "${package_status[allowlist_contract]}" == \
                  "pgw-product-evidence-v1" ]] || return 1
              [[ "${package_status[source_manifest_file]}" == "product-manifest.txt" && \
                  "${package_status[digest_file]}" == "product-evidence-sha256.txt" && \
                  "${package_status[digest_scope]}" == \
                    "all_files_except_digest_manifest" ]] || return 1
              [[ "${package_status[run_id]}" == "$GITHUB_RUN_ID" && \
                  "${package_status[run_attempt]}" == "$GITHUB_RUN_ATTEMPT" && \
                  "${package_status[run_token]}" == "$run_token" ]] || return 1
              [[ "${package_status[harness_exit]}" =~ ^[0-9]+$ && \
                  "${package_status[packaged_source_files]}" =~ ^[0-9]+$ && \
                  "${package_status[packaged_source_files]}" == "$source_file_count" ]] || \
                return 1
              case "${package_status[source_manifest_presence]}" in
                present)
                  [[ -f "$package/product-manifest.txt" ]] || return 1
                  ;;
                missing)
                  [[ ! -e "$package/product-manifest.txt" && \
                      ! -L "$package/product-manifest.txt" ]] || return 1
                  ;;
                *)
                  return 1
                  ;;
              esac
              case "${package_status[validation]}" in
                VALIDATED)
                  [[ "${package_status[harness_exit]}" == "0" && \
                      "${package_status[semantic_validation]}" == "PASS" && \
                      "${package_status[source_manifest_presence]}" == "present" ]] || \
                    return 1
                  [[ -f "$package/product-manifest.txt" ]] || return 1
                  for key in "${artifact_keys[@]}"; do
                    [[ -f "$package/${expected_artifact_names[$key]}" ]] || return 1
                  done
                  ;;
                UNVALIDATED_FAILURE)
                  [[ "${package_status[semantic_validation]}" != "PASS" ]] || return 1
                  ;;
                *)
                  return 1
                  ;;
              esac

              [[ -f "$package/product-evidence-sha256.txt" && \
                  ! -L "$package/product-evidence-sha256.txt" ]] || return 1
              while read -r digest_hash digest_name digest_extra; do
                [[ "$digest_hash" =~ ^[0-9a-f]{64}$ && -n "$digest_name" && \
                    -z "$digest_extra" && \
                    "$digest_name" == "$(basename -- "$digest_name")" && \
                    "$digest_name" != "product-evidence-sha256.txt" && \
                    -v "allowed_package_files[$digest_name]" && \
                    -f "$package/$digest_name" && ! -L "$package/$digest_name" && \
                    ! -v "digest_seen[$digest_name]" ]] || return 1
                digest_seen["$digest_name"]=1
              done < "$package/product-evidence-sha256.txt"
              while IFS= read -r -d '' entry; do
                name="${entry##*/}"
                [[ "$name" == "product-evidence-sha256.txt" || \
                    -v "digest_seen[$name]" ]] || return 1
              done < <(find -P "$package" -xdev -mindepth 1 -maxdepth 1 \
                -type f -print0)
              [[ "${#digest_seen[@]}" -eq $((file_count - 1)) ]] || return 1
              (cd "$package" && sha256sum --check --strict --status \
                product-evidence-sha256.txt)
            }
            echo "product_evidence_contract=pgw-product-evidence-v1" \
              >> "$evidence/summary.txt"
            set +e
            sudo -n env \
              PATH="$PATH" \
              GOTOOLCHAIN="$GOTOOLCHAIN" \
              GOMODCACHE="$(go env GOMODCACHE)" \
              GOCACHE="$RUNNER_TEMP/pgw-e2e-root-cache" \
              PGW_E2E_REQUIRE_BASE_KILL_SWITCH="1" \
              PGW_E2E_RUN_TOKEN="$run_token" \
              PGW_E2E_RESOURCE_MANIFEST="$resource_manifest" \
              PGW_E2E_ARTIFACT_DIR="$product_artifacts" \
              PGW_E2E_PREFIX="$prefix" \
              PGW_EVIDENCE_DIR="$evidence" \
              PGW_E2E_BIN_DIR="$RUNNER_TEMP/pgw-e2e-bin" \
              bash "$harness" 2>&1 | tee "$evidence/harness.log"
            harness_exit_rc=${PIPESTATUS[0]}
            harness_rc=$harness_exit_rc
            set -e
            echo "product_harness=RUN" >> "$evidence/summary.txt"
            echo "product_harness_path=$harness" >> "$evidence/summary.txt"
            echo "product_harness_exit=$harness_exit_rc" >> "$evidence/summary.txt"

            product_tree_safe=0
            if [[ -d "$product_artifacts" && ! -L "$product_artifacts" ]]; then
              unsupported_entry=""
              unreadable_inventory="$evidence/product-unreadable-artifacts.txt"
              if ! unsupported_entry="$(find -P "$product_artifacts" -xdev -mindepth 1 \
                ! \( -type d -o -type f \) -printf '%f\n' -quit)"; then
                echo "product_artifact_tree_validation=FAILED:tree_walk" \
                  >> "$evidence/summary.txt"
                harness_rc=1
              elif [[ -n "$unsupported_entry" ]]; then
                echo "product_artifact_tree_validation=FAILED:unsupported_entry:$unsupported_entry" \
                  >> "$evidence/summary.txt"
                harness_rc=1
              elif ! find -P "$product_artifacts" -xdev -type f ! -readable -printf '%f\n' \
                | sort > "$unreadable_inventory"; then
                echo "product_artifact_tree_readability=FAILED:tree_walk" \
                  >> "$evidence/summary.txt"
                harness_rc=1
              elif [[ -s "$unreadable_inventory" ]]; then
                IFS= read -r unreadable_artifact < "$unreadable_inventory"
                echo "product_artifact_tree_readability=FAILED:$unreadable_artifact" \
                  >> "$evidence/summary.txt"
                harness_rc=1
              else
                echo "product_artifact_tree_validation=PASS" >> "$evidence/summary.txt"
                echo "product_artifact_tree_readability=PASS" >> "$evidence/summary.txt"
                product_tree_safe=1
              fi
            else
              echo "product_artifact_tree_validation=FAILED:invalid_root" \
                >> "$evidence/summary.txt"
              harness_rc=1
            fi

            artifact_inventory="$evidence/product-artifact-inventory.txt"
            manifest_file="$product_artifacts/product-manifest.txt"
            if [[ "$product_tree_safe" -eq 1 ]]; then
              find -P "$product_artifacts" -maxdepth 1 -type f -printf '%f\n' \
                | sort > "$artifact_inventory"
            else
              : > "$artifact_inventory"
            fi

            evidence_error() {
              echo "product_evidence_error=$1" >> "$evidence/summary.txt"
              harness_rc=1
            }

            semantic_status="NOT_RUN"
            if [[ "$harness_rc" -eq 0 ]]; then
              semantic_status="FAILED"
              declare -A product_manifest=()
              if [[ ! -f "$manifest_file" ]]; then
                evidence_error "missing_manifest"
              elif [[ ! -r "$manifest_file" ]]; then
                evidence_error "unreadable_manifest"
              else
                while IFS='=' read -r key value; do
                  if [[ ! "$key" =~ ^[a-z][a-z0-9_]*$ || -z "$value" ]]; then
                    evidence_error "invalid_manifest_entry"
                    continue
                  fi
                  if [[ -v "product_manifest[$key]" ]]; then
                    evidence_error "duplicate_manifest_key:$key"
                    continue
                  fi
                  product_manifest["$key"]="$value"
                done < "$manifest_file"
              fi

              required_keys=(
                format
                evidence_contract
                evidence_state
                renderer
                rendered_sha256
                run_token
                namespace_prefix
                counter_mode
                require_base_kill_switch
                client_namespace
                gateway_namespace
                wan_namespace
                client_veth
                gateway_lan_veth
                gateway_wan_veth
                wan_veth
              )
              required_keys+=("${artifact_keys[@]}" "${optional_artifact_keys[@]}")
              for key in "${required_keys[@]}"; do
                [[ -n "${product_manifest[$key]:-}" ]] || evidence_error "missing_manifest_key:$key"
              done

              expected_evidence_format="$(< test/e2e/EVIDENCE_FORMAT)"
              [[ "$expected_evidence_format" =~ ^pgw-wave[0-9]+-e2e-v[0-9]+$ ]] || \
                evidence_error "invalid_repository_evidence_format"
              [[ "${product_manifest[format]:-}" == "$expected_evidence_format" ]] || \
                evidence_error "invalid_manifest_format"
              [[ "${product_manifest[evidence_contract]:-}" == "pgw-product-evidence-v1" ]] || \
                evidence_error "invalid_evidence_contract"
              [[ "${product_manifest[evidence_state]:-}" == "complete" ]] || \
                evidence_error "incomplete_evidence_manifest"
              [[ "${product_manifest[run_token]:-}" == "$run_token" ]] || \
                evidence_error "manifest_run_token_mismatch"
              [[ "${product_manifest[namespace_prefix]:-}" == "$prefix" ]] || \
                evidence_error "manifest_namespace_prefix_mismatch"
              [[ "${product_manifest[rendered_sha256]:-}" =~ ^[0-9a-f]{64}$ ]] || \
                evidence_error "invalid_rendered_sha256"

              manifest_base_kill_switch="${product_manifest[require_base_kill_switch]:-}"
              case "$manifest_base_kill_switch" in
                1|true)
                  manifest_base_kill_switch=1
                  ;;
                0|false)
                  manifest_base_kill_switch=0
                  ;;
                *)
                  evidence_error "invalid_manifest_base_kill_switch"
                  ;;
              esac
              [[ "$manifest_base_kill_switch" == "$base_kill_switch" ]] || \
                evidence_error "manifest_base_kill_switch_mismatch"

              declare -A expected_resources=(
                [client_namespace]="netns:${prefix}-product-client"
                [gateway_namespace]="netns:${prefix}-product-gateway"
                [wan_namespace]="netns:${prefix}-product-wan"
                [client_veth]="link:cl${run_token}"
                [gateway_lan_veth]="link:gl${run_token}"
                [gateway_wan_veth]="link:gw${run_token}"
                [wan_veth]="link:we${run_token}"
              )
              for key in "${!expected_resources[@]}"; do
                resource_type="${expected_resources[$key]%%:*}"
                expected_name="${expected_resources[$key]#*:}"
                actual_name="${product_manifest[$key]:-}"
                [[ "$actual_name" == "$expected_name" ]] || \
                  evidence_error "invalid_product_resource:$key"
                if ! grep -Fqx "$resource_type"$'\t'"$actual_name" "$resource_manifest"; then
                  evidence_error "unregistered_product_resource:$key"
                fi
              done

              declare -A product_artifact_files=()
              for key in "${artifact_keys[@]}"; do
                artifact_name="${expected_artifact_names[$key]}"
                [[ "${product_manifest[$key]:-}" == "$artifact_name" ]] || \
                  evidence_error "noncanonical_artifact_reference:$key"
                artifact_file="$product_artifacts/$artifact_name"
                product_artifact_files["$key"]="$artifact_file"
                [[ -f "$artifact_file" && ! -L "$artifact_file" ]] || \
                  evidence_error "invalid_artifact_file:$(basename -- "$artifact_file")"
                [[ -r "$artifact_file" ]] || \
                  evidence_error "unreadable_artifact_file:$(basename -- "$artifact_file")"
                if [[ "$key" != "invalid_dynamic_stdout_log" && ! -s "$artifact_file" ]]; then
                  evidence_error "empty_artifact_file:$(basename -- "$artifact_file")"
                fi
              done
              for key in "${optional_artifact_keys[@]}"; do
                artifact_name="${expected_optional_artifact_names[$key]}"
                [[ "${product_manifest[$key]:-}" == "$artifact_name" ]] || \
                  evidence_error "noncanonical_optional_artifact_reference:$key"
              done

              nested_entry="$(find -P "$product_artifacts" -xdev -mindepth 2 \
                -printf '%P\n' -quit)"
              [[ -z "$nested_entry" ]] || evidence_error "nested_product_artifact:$nested_entry"
              while IFS= read -r artifact_name; do
                [[ -v "seen_product_artifacts[$artifact_name]" ]] || \
                  evidence_error "undeclared_product_artifact:$artifact_name"
              done < "$artifact_inventory"

              rendered_file="${product_artifact_files[rendered_ruleset]}"
              rendered_sha_file="${product_artifact_files[rendered_sha256_file]}"
              ruleset_file="${product_artifact_files[applied_ruleset_json]}"
              counters_file="${product_artifact_files[counters]}"
              dynamic_before_file="${product_artifact_files[dynamic_before_invalid_json]}"
              dynamic_after_file="${product_artifact_files[dynamic_after_invalid_json]}"
              base_after_file="${product_artifact_files[base_after_invalid_json]}"

              if [[ -f "$rendered_file" ]]; then
                actual_rendered_sha256="$(sha256sum "$rendered_file" | cut -d' ' -f1)"
                [[ "$actual_rendered_sha256" == "${product_manifest[rendered_sha256]:-}" ]] || \
                  evidence_error "rendered_sha256_mismatch"
              fi
              if [[ -f "$rendered_sha_file" ]]; then
                sidecar_sha=""
                sidecar_name=""
                read -r sidecar_sha sidecar_name < "$rendered_sha_file" || \
                  evidence_error "unreadable_rendered_sha256_sidecar"
                [[ "$sidecar_sha" == "${product_manifest[rendered_sha256]:-}" && \
                    "$sidecar_name" == "product-rendered-ruleset.nft" ]] || \
                  evidence_error "invalid_rendered_sha256_sidecar"
              fi

              if [[ -f "$ruleset_file" ]] && ! jq -e '
                ((.nftables | type) == "array") and
                ((.nftables | length) > 0) and
                ([.nftables[]? | .table? | select(type == "object")] | length > 0) and
                ([.nftables[]? | .chain? | select(type == "object")] | length > 0) and
                ([.nftables[]? | .rule? | select(type == "object")] | length > 0)
              ' "$ruleset_file" >/dev/null; then
                evidence_error "invalid_or_empty_ruleset_json"
              fi

              counter_mode="${product_manifest[counter_mode]:-}"
              [[ "$counter_mode" == "required" ]] || \
                evidence_error "counter_mode_must_be_required"
              if [[ -f "$counters_file" ]]; then
                if ! jq -e '
                  def counters:
                    [.nftables[]? |
                      if ((.counter? | type) == "object") then
                        .counter
                      elif ((.rule? | type) == "object") then
                        .rule.expr[]? | .counter? | select(type == "object")
                      else
                        empty
                      end |
                      select(length > 0)];
                  ((.nftables | type) == "array") and
                  ((.nftables | length) > 0) and
                  ((counters | length) > 0)
                ' "$counters_file" >/dev/null; then
                  evidence_error "invalid_or_empty_required_counter_json"
                elif [[ "$counter_mode" == "required" ]]; then
                  echo "counter_evidence=PASS:required" >> "$evidence/summary.txt"
                fi
              fi

              for json_spec in \
                "$dynamic_before_file:pgw_dynamic" \
                "$dynamic_after_file:pgw_dynamic" \
                "$base_after_file:pgw_base"; do
                json_file="${json_spec%:*}"
                expected_table="${json_spec##*:}"
                if [[ -f "$json_file" ]] && ! jq -e --arg table "$expected_table" '
                  ((.nftables | type) == "array") and
                  ((.nftables | length) > 0) and
                  ([.nftables[]? | .table? |
                    select((type == "object") and (.family == "inet") and (.name == $table))] |
                    length > 0)
                ' "$json_file" >/dev/null; then
                  evidence_error "invalid_lkg_json:$(basename -- "$json_file")"
                fi
              done
              if [[ -f "$dynamic_before_file" && -f "$dynamic_after_file" ]] && \
                  ! cmp -s "$dynamic_before_file" "$dynamic_after_file"; then
                evidence_error "dynamic_lkg_changed_after_invalid_candidate"
              fi
              if [[ -f "${product_artifact_files[invalid_dynamic_candidate]}" ]] && \
                  ! grep -Fq 'missing_chain' \
                    "${product_artifact_files[invalid_dynamic_candidate]}"; then
                evidence_error "invalid_candidate_missing_failure_fixture"
              fi
              if [[ -f "${product_artifact_files[probe_log]}" ]] && \
                  ! grep -Fqx 'PASS Wave 1 namespace enforcement completed' \
                    "${product_artifact_files[probe_log]}"; then
                evidence_error "missing_final_probe_pass_marker"
              fi

              if [[ "$harness_rc" -eq 0 ]]; then
                semantic_status="PASS"
                echo "product_evidence_validation=PASS" >> "$evidence/summary.txt"
              else
                echo "product_evidence_validation=FAILED" >> "$evidence/summary.txt"
              fi
            elif [[ "$harness_exit_rc" -ne 0 ]]; then
              echo "product_evidence_validation=SKIPPED:harness_failure" \
                >> "$evidence/summary.txt"
            else
              echo "product_evidence_validation=SKIPPED:unsafe_source" \
                >> "$evidence/summary.txt"
            fi

            if [[ "$product_tree_safe" -eq 1 ]]; then
              package_status="UNVALIDATED_FAILURE"
              [[ "$semantic_status" == "PASS" && "$harness_rc" -eq 0 ]] && \
                package_status="VALIDATED"
              product_stage_work="$(mktemp -d \
                "$RUNNER_TEMP/.pgw-e2e-product-package.XXXXXXXXXX")"
              chmod 0700 "$product_stage_work"
              staged_names=()
              staging_safe=1
              for artifact_name in "${product_allowlist[@]}"; do
                artifact_file="$product_artifacts/$artifact_name"
                if [[ -e "$artifact_file" || -L "$artifact_file" ]]; then
                  if [[ ! -f "$artifact_file" || -L "$artifact_file" || \
                      ! -r "$artifact_file" ]]; then
                    echo "product_evidence_staging=FAILED:unsafe_allowlisted_file:$artifact_name" \
                      >> "$evidence/summary.txt"
                    harness_rc=1
                    staging_safe=0
                    break
                  fi
                  install -m 0600 -- "$artifact_file" \
                    "$product_stage_work/$artifact_name"
                  staged_names+=("$artifact_name")
                fi
              done
              if [[ "$staging_safe" -eq 1 ]]; then
                manifest_presence="missing"
                [[ -f "$product_stage_work/product-manifest.txt" ]] && \
                  manifest_presence="present"
                {
                  echo "package_contract=pgw-product-evidence-package-v1"
                  echo "validation=$package_status"
                  echo "harness_exit=$harness_exit_rc"
                  echo "semantic_validation=$semantic_status"
                  echo "allowlist_contract=pgw-product-evidence-v1"
                  echo "source_manifest_file=product-manifest.txt"
                  echo "source_manifest_presence=$manifest_presence"
                  echo "packaged_source_files=${#staged_names[@]}"
                  echo "digest_file=product-evidence-sha256.txt"
                  echo "digest_scope=all_files_except_digest_manifest"
                  echo "run_id=$GITHUB_RUN_ID"
                  echo "run_attempt=$GITHUB_RUN_ATTEMPT"
                  echo "run_token=$run_token"
                } > "$product_stage_work/product-evidence-status.txt"
                chmod 0600 "$product_stage_work/product-evidence-status.txt"
                staged_names+=(product-evidence-status.txt)
                : > "$product_stage_work/product-evidence-sha256.txt"
                for staged_name in "${staged_names[@]}"; do
                  (cd "$product_stage_work" && sha256sum -- "$staged_name") \
                    >> "$product_stage_work/product-evidence-sha256.txt"
                done
                chmod 0600 "$product_stage_work/product-evidence-sha256.txt"
                if audit_product_package "$product_stage_work"; then
                  {
                    echo "product_package_ready=true"
                    echo "product_package_path=$product_stage_work"
                  } >> "$GITHUB_OUTPUT"
                  echo "product_evidence_staging=PASS:$package_status" \
                    >> "$evidence/summary.txt"
                else
                  echo "product_evidence_staging=FAILED:package_audit" \
                    >> "$evidence/summary.txt"
                  harness_rc=1
                fi
              fi
            else
              echo "product_evidence_staging=SKIPPED:unsafe_source" \
                >> "$evidence/summary.txt"
            fi
            exit "$harness_rc"
          fi

          echo "product_harness=NOT_IMPLEMENTED" >> "$evidence/summary.txt"
          echo "The runner/netns/nft orchestration passed; no PGW product claim is made." \
            > "$evidence/HARNESS_NOT_IMPLEMENTED.txt"
          if [[ "$REQUIRE_HARNESS" == "true" ]]; then
            exit 2
          fi

      - name: Prepare link-free evidence bundle
        id: prepare_upload
        if: ${{ always() }}
        env:
          PRODUCT_PACKAGE_READY: ${{ steps.run_harness.outputs.product_package_ready }}
          PRODUCT_PACKAGE_PATH: ${{ steps.run_harness.outputs.product_package_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 0077

          evidence_source="$RUNNER_TEMP/pgw-netns-evidence"
          product_destination="pgw-e2e-product-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          run_token="$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            | sha256sum | cut -c1-10)"
          product_source_allowlist=(
            product-manifest.txt
            product-rendered-ruleset.nft
            product-base-ruleset.nft
            product-dynamic-ruleset.nft
            product-rendered-ruleset.sha256
            product-applied-ruleset.json
            product-applied-ruleset.txt
            product-counters.json
            product-probes.log
            product-valid-dynamic-replacement.nft
            product-dynamic-before-invalid.json
            product-dynamic-after-invalid.json
            product-invalid-dynamic-candidate.nft
            product-invalid-dynamic.stdout.log
            product-invalid-dynamic.stderr.log
            product-base-after-invalid.json
            gateway-http.log
            gateway-http-restarted.log
            gateway-dns-tcp.log
            gateway-management.log
            gateway-management-ipv6.log
            wan-direct-sentinel.log
            wan-http.log
            wan-http6.log
            udp-control-before-rules.log
            udp-blocked-client.log
            udp-control-after-rules.log
            startup-readiness-diagnostics.txt
            readiness-mapped-ipv4.curl.log
            readiness-unmapped-ipv4.curl.log
            readiness-ipv6.curl.log
            readiness-management-ipv6.curl.log
            readiness-direct-sentinel.curl.log
            product-counters.capture-error.txt
          )
          required_success_files=(
            product-manifest.txt
            product-rendered-ruleset.nft
            product-base-ruleset.nft
            product-dynamic-ruleset.nft
            product-rendered-ruleset.sha256
            product-applied-ruleset.json
            product-applied-ruleset.txt
            product-counters.json
            product-probes.log
            product-valid-dynamic-replacement.nft
            product-dynamic-before-invalid.json
            product-dynamic-after-invalid.json
            product-invalid-dynamic-candidate.nft
            product-invalid-dynamic.stdout.log
            product-invalid-dynamic.stderr.log
            product-base-after-invalid.json
            gateway-http.log
            gateway-http-restarted.log
            gateway-dns-tcp.log
            gateway-management.log
            gateway-management-ipv6.log
            wan-direct-sentinel.log
            wan-http.log
            wan-http6.log
            udp-control-before-rules.log
            udp-blocked-client.log
            udp-control-after-rules.log
          )

          audit_product_package() {
            local package="$1"
            local digest_extra digest_hash digest_name entry file_count=0 key
            local name package_gid package_mode package_uid source_file_count=0
            local status_file status_gid status_mode status_uid status_links value
            local -a required_status_keys=(
              package_contract
              validation
              harness_exit
              semantic_validation
              allowlist_contract
              source_manifest_file
              source_manifest_presence
              packaged_source_files
              digest_file
              digest_scope
              run_id
              run_attempt
              run_token
            )
            local -A allowed_package_files=()
            local -A allowed_status_keys=()
            local -A digest_seen=()
            local -A package_status=()

            [[ -d "$package" && ! -L "$package" ]] || return 1
            IFS=: read -r package_uid package_gid package_mode < <(
              stat -c '%u:%g:%a' -- "$package"
            )
            [[ "$package_uid" == "$(id -u)" && "$package_gid" == "$(id -g)" && \
                "$package_mode" == "700" ]] || return 1
            [[ -z "$(find -P "$package" -xdev -mindepth 2 -print -quit)" ]] || return 1
            [[ -z "$(find -P "$package" -xdev -mindepth 1 -maxdepth 1 \
              ! -type f -print -quit)" ]] || return 1

            for name in "${product_source_allowlist[@]}" \
              product-evidence-status.txt product-evidence-sha256.txt; do
              allowed_package_files["$name"]=1
            done
            while IFS= read -r -d '' entry; do
              name="${entry##*/}"
              [[ -v "allowed_package_files[$name]" ]] || return 1
              IFS=: read -r status_uid status_gid status_mode status_links < <(
                stat -c '%u:%g:%a:%h' -- "$entry"
              )
              [[ "$status_uid" == "$(id -u)" && "$status_gid" == "$(id -g)" && \
                  "$status_mode" == "600" && "$status_links" == "1" ]] || return 1
              ((file_count += 1))
              if [[ "$name" != "product-evidence-status.txt" && \
                  "$name" != "product-evidence-sha256.txt" ]]; then
                ((source_file_count += 1))
              fi
            done < <(find -P "$package" -xdev -mindepth 1 -maxdepth 1 \
              -type f -print0)

            status_file="$package/product-evidence-status.txt"
            [[ -f "$status_file" && ! -L "$status_file" ]] || return 1
            for key in "${required_status_keys[@]}"; do
              allowed_status_keys["$key"]=1
            done
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[a-z][a-z0-9_]*$ && -n "$value" && \
                  -v "allowed_status_keys[$key]" && \
                  ! -v "package_status[$key]" ]] || return 1
              package_status["$key"]="$value"
            done < "$status_file"
            for key in "${required_status_keys[@]}"; do
              [[ -n "${package_status[$key]:-}" ]] || return 1
            done
            [[ "${package_status[package_contract]}" == \
                "pgw-product-evidence-package-v1" && \
                "${package_status[allowlist_contract]}" == \
                  "pgw-product-evidence-v1" ]] || return 1
            [[ "${package_status[source_manifest_file]}" == "product-manifest.txt" && \
                "${package_status[digest_file]}" == "product-evidence-sha256.txt" && \
                "${package_status[digest_scope]}" == \
                  "all_files_except_digest_manifest" ]] || return 1
            [[ "${package_status[run_id]}" == "$GITHUB_RUN_ID" && \
                "${package_status[run_attempt]}" == "$GITHUB_RUN_ATTEMPT" && \
                "${package_status[run_token]}" == "$run_token" ]] || return 1
            [[ "${package_status[harness_exit]}" =~ ^[0-9]+$ && \
                "${package_status[packaged_source_files]}" =~ ^[0-9]+$ && \
                "${package_status[packaged_source_files]}" == "$source_file_count" ]] || \
              return 1
            case "${package_status[source_manifest_presence]}" in
              present)
                [[ -f "$package/product-manifest.txt" ]] || return 1
                ;;
              missing)
                [[ ! -e "$package/product-manifest.txt" && \
                    ! -L "$package/product-manifest.txt" ]] || return 1
                ;;
              *) return 1 ;;
            esac
            case "${package_status[validation]}" in
              VALIDATED)
                [[ "${package_status[harness_exit]}" == "0" && \
                    "${package_status[semantic_validation]}" == "PASS" && \
                    "${package_status[source_manifest_presence]}" == "present" ]] || \
                  return 1
                for name in "${required_success_files[@]}"; do
                  [[ -f "$package/$name" ]] || return 1
                done
                ;;
              UNVALIDATED_FAILURE)
                [[ "${package_status[semantic_validation]}" != "PASS" ]] || return 1
                ;;
              *) return 1 ;;
            esac

            [[ -f "$package/product-evidence-sha256.txt" && \
                ! -L "$package/product-evidence-sha256.txt" ]] || return 1
            while read -r digest_hash digest_name digest_extra; do
              [[ "$digest_hash" =~ ^[0-9a-f]{64}$ && -n "$digest_name" && \
                  -z "$digest_extra" && \
                  "$digest_name" == "$(basename -- "$digest_name")" && \
                  "$digest_name" != "product-evidence-sha256.txt" && \
                  -v "allowed_package_files[$digest_name]" && \
                  -f "$package/$digest_name" && ! -L "$package/$digest_name" && \
                  ! -v "digest_seen[$digest_name]" ]] || return 1
              digest_seen["$digest_name"]=1
            done < "$package/product-evidence-sha256.txt"
            while IFS= read -r -d '' entry; do
              name="${entry##*/}"
              [[ "$name" == "product-evidence-sha256.txt" || \
                  -v "digest_seen[$name]" ]] || return 1
            done < <(find -P "$package" -xdev -mindepth 1 -maxdepth 1 \
              -type f -print0)
            [[ "${#digest_seen[@]}" -eq $((file_count - 1)) ]] || return 1
            (cd "$package" && sha256sum --check --strict --status \
              product-evidence-sha256.txt)
          }

          stage_tree() {
            local source="$1"
            local destination="$2"
            local entry relative unsupported_entry

            [[ -d "$source" && ! -L "$source" ]] || {
              echo "refusing unsafe upload source root: $source" >&2
              return 1
            }
            find -P "$source" -xdev -mindepth 1 -print0 >/dev/null
            unsupported_entry="$(find -P "$source" -xdev -mindepth 1 \
              ! \( -type d -o -type f \) -printf '%f\n' -quit)"
            [[ -z "$unsupported_entry" ]] || {
              echo "refusing unsupported upload entry: $unsupported_entry" >&2
              return 1
            }

            install -d -m 0700 "$destination"
            while IFS= read -r -d '' entry; do
              relative="${entry#"$source"/}"
              install -d -m 0700 "$destination/$relative"
            done < <(find -P "$source" -xdev -mindepth 1 -type d -print0)
            while IFS= read -r -d '' entry; do
              relative="${entry#"$source"/}"
              install -m 0600 -- "$entry" "$destination/$relative"
            done < <(find -P "$source" -xdev -mindepth 1 -type f -print0)

            unsupported_entry="$(find -P "$destination" -xdev -mindepth 1 \
              ! \( -type d -o -type f \) -printf '%f\n' -quit)"
            [[ -z "$unsupported_entry" ]]
          }

          audit_bundle() {
            local bundle="$1"
            local product_included="$2"
            local entry entry_gid entry_links entry_mode entry_uid name
            local -A allowed_top=(
              [pgw-netns-evidence]=1
            )

            [[ -d "$bundle" && ! -L "$bundle" ]] || return 1
            if [[ "$product_included" -eq 1 ]]; then
              allowed_top["$product_destination"]=1
            fi
            while IFS= read -r -d '' entry; do
              name="${entry##*/}"
              [[ -v "allowed_top[$name]" ]] || return 1
            done < <(find -P "$bundle" -xdev -mindepth 1 -maxdepth 1 -print0)
            [[ -d "$bundle/pgw-netns-evidence" && \
                ! -L "$bundle/pgw-netns-evidence" ]] || return 1
            if [[ "$product_included" -eq 0 ]]; then
              [[ ! -e "$bundle/$product_destination" && \
                  ! -L "$bundle/$product_destination" ]] || return 1
            fi
            [[ -z "$(find -P "$bundle" -xdev -mindepth 1 \
              ! \( -type d -o -type f \) -print -quit)" ]] || return 1
            while IFS= read -r -d '' entry; do
              IFS=: read -r entry_uid entry_gid entry_mode < <(
                stat -c '%u:%g:%a' -- "$entry"
              )
              [[ "$entry_uid" == "$(id -u)" && "$entry_gid" == "$(id -g)" && \
                  "$entry_mode" == "700" ]] || return 1
            done < <(find -P "$bundle" -xdev -type d -print0)
            while IFS= read -r -d '' entry; do
              IFS=: read -r entry_uid entry_gid entry_mode entry_links < <(
                stat -c '%u:%g:%a:%h' -- "$entry"
              )
              [[ "$entry_uid" == "$(id -u)" && "$entry_gid" == "$(id -g)" && \
                  "$entry_mode" == "600" && "$entry_links" == "1" ]] || return 1
            done < <(find -P "$bundle" -xdev -type f -print0)
            if [[ "$product_included" -eq 1 ]]; then
              audit_product_package "$bundle/$product_destination"
            fi
          }

          bundle="$(mktemp -d "$RUNNER_TEMP/.pgw-netns-upload-bundle.XXXXXXXXXX")"
          chmod 0700 "$bundle"
          stage_tree "$evidence_source" "$bundle/pgw-netns-evidence"
          product_included=0
          if [[ "$PRODUCT_PACKAGE_READY" == "true" ]]; then
            if audit_product_package "$PRODUCT_PACKAGE_PATH"; then
              product_copy="$(mktemp -d \
                "$RUNNER_TEMP/.pgw-e2e-product-copy.XXXXXXXXXX")"
              chmod 0700 "$product_copy"
              stage_tree "$PRODUCT_PACKAGE_PATH" "$product_copy"
              audit_product_package "$product_copy"
              mv -- "$product_copy" "$bundle/$product_destination"
              product_included=1
            else
              echo "excluding product package that failed provenance audit" >&2
            fi
          fi
          audit_bundle "$bundle" "$product_included"
          {
            echo "bundle_ready=true"
            echo "bundle_path=$bundle"
            echo "product_package_included=$product_included"
          } >> "$GITHUB_OUTPUT"

      - name: Upload namespace evidence
        if: ${{ always() && steps.prepare_upload.outputs.bundle_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: network-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_upload.outputs.bundle_path }}
          if-no-files-found: error
          retention-days: 14
